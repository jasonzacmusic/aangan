<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pi Pad">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pi Pad</title>
<style>
  :root{
    --bg:#0f1117; --surface:#1a1d27; --raised:#232735; --line:#2c3142;
    --ink:#e8eaf0; --soft:#8b91a5; --accent:#4f8ef7; --accent-ink:#0f1117;
    --ok:#3ecf8e; --warn:#f2b84b; --bad:#f2647a;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 10px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 10px);gap:8px}

  header{display:flex;align-items:center;gap:10px;min-height:30px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none;
    box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
  .dot.bad{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
  .host{font-weight:600;letter-spacing:.01em}
  .state{color:var(--soft);font-size:13px}
  header .spacer{flex:1}
  .icon-btn{background:none;border:0;color:var(--soft);font-size:20px;padding:4px 6px;cursor:pointer}

  .keys{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .k{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:9px;height:38px;font:600 13px/1 inherit;cursor:pointer;touch-action:manipulation;
    display:flex;align-items:center;justify-content:center;min-width:0}
  .k:active,.k.flash{background:var(--raised)}
  .k.mod.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .k.kbd{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .k.kbd.open{background:var(--surface);color:var(--accent)}

  .pad{flex:1;position:relative;border-radius:18px;background:var(--surface);
    border:1px solid var(--line);touch-action:none;overflow:hidden;
    background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);
    background-size:22px 22px}
  .pad.active{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
  .hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:var(--soft);
    font-size:12.5px;line-height:1.6;pointer-events:none;padding:0 16px;transition:opacity .4s}
  .pad.used .hint{opacity:0}
  .mode{position:absolute;top:12px;right:14px;font-size:12px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent);opacity:0;transition:opacity .15s;pointer-events:none}
  .mode.show{opacity:1}

  .buttons{display:grid;grid-template-columns:1fr 84px 1fr;gap:8px;height:64px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--soft);
    border-radius:14px;font:600 13px/1 inherit;letter-spacing:.04em;cursor:pointer;touch-action:none}
  .btn.down{background:var(--raised);color:var(--ink)}
  .btn.hold.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

  #type{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;
    font-size:16px;resize:none}   /* 16px stops iOS zooming when it focuses */

  .sheet{position:fixed;inset:0;background:rgba(5,6,10,.72);display:none;align-items:center;
    justify-content:center;padding:24px;z-index:5}
  .sheet.show{display:flex}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;
    width:100%;max-width:340px;-webkit-user-select:text;user-select:text}
  .card h2{margin:0 0 6px;font-size:18px}
  .card p{margin:0 0 14px;color:var(--soft);font-size:14px;line-height:1.45}
  .card input[type=tel]{width:100%;font:600 26px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
    text-align:center;background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;padding:14px 10px;margin-bottom:12px}
  .card label{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;font-size:14px}
  .card input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;gap:8px;margin-top:16px}
  .row button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--raised);
    color:var(--ink);font:600 14px/1 inherit;cursor:pointer}
  .row button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin:-4px 0 0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.hint,.mode{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="dot" id="dot"></span>
    <span class="host" id="host">Pi Pad</span>
    <span class="state" id="state">connecting…</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="gear" aria-label="Settings">⚙︎</button>
  </header>

  <div class="keys" id="keys">
    <button class="k kbd" id="kbd" aria-label="Show keyboard"><svg width="22" height="16" viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="1" y="1" width="20" height="14" rx="2.5"/><path d="M5 5h.01M8.5 5h.01M12 5h.01M15.5 5h.01M5 8.5h.01M8.5 8.5h.01M12 8.5h.01M15.5 8.5h.01M7 11.5h8"/></svg></button>
    <button class="k mod" data-mod="ctrl">ctrl</button>
    <button class="k mod" data-mod="alt">alt</button>
    <button class="k mod" data-mod="super" aria-label="Super">❖</button>
    <button class="k" data-key="Escape">esc</button>
    <button class="k" data-key="Tab">tab</button>
    <button class="k" data-key="Backspace" aria-label="Backspace">⌫</button>
    <button class="k" data-key="Enter" aria-label="Enter">⏎</button>
    <button class="k" data-key="Super" aria-label="Open menu">☰</button>
    <button class="k" data-key="ArrowLeft" aria-label="Left">←</button>
    <button class="k" data-key="ArrowUp" aria-label="Up">↑</button>
    <button class="k" data-key="ArrowDown" aria-label="Down">↓</button>
    <button class="k" data-key="ArrowRight" aria-label="Right">→</button>
    <button class="k" data-key="Home">home</button>
    <button class="k" data-key="End">end</button>
    <button class="k" data-key="Delete">del</button>
  </div>

  <div class="pad" id="pad">
    <div class="mode" id="mode"></div>
    <div class="hint">One finger moves · tap to click · tap-tap-drag to drag<br>
      Two fingers scroll · two-finger tap right-clicks</div>
  </div>

  <div class="buttons">
    <button class="btn" data-btn="left">LEFT</button>
    <button class="btn hold" id="hold">HOLD</button>
    <button class="btn" data-btn="right">RIGHT</button>
  </div>
</div>

<textarea id="type" autocomplete="off" autocorrect="off" autocapitalize="off"
  spellcheck="false" enterkeyhint="send" aria-label="Type to the Pi"></textarea>

<div class="sheet" id="pinSheet">
  <div class="card">
    <h2>Enter the Pi's PIN</h2>
    <p>Six digits. It was printed when Pi Pad was installed, and it is in the link the setup gave you.</p>
    <input type="tel" id="pinInput" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
    <p class="err" id="pinErr"></p>
    <div class="row"><button class="primary" id="pinSave">Connect</button></div>
  </div>
</div>

<div class="sheet" id="setSheet">
  <div class="card">
    <h2>Settings</h2>
    <label for="sens">Pointer speed <span id="sensVal"></span></label>
    <input type="range" id="sens" min="0.6" max="4" step="0.1">
    <label for="natural">Natural scrolling <input type="checkbox" id="natural"></label>
    <div class="row">
      <button id="forget">Forget PIN</button>
      <button class="primary" id="setDone">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("pipad." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("pipad." + k, JSON.stringify(v)); } catch {} }
  };

  // ---- settings -----------------------------------------------------------
  const prefs = { sens: store.get("sens", 1.8), natural: store.get("natural", true) };
  const urlPin = new URLSearchParams(location.search).get("pin");
  if (urlPin && /^\d{6}$/.test(urlPin)) store.set("pin", urlPin);
  let pin = store.get("pin", "");

  // ---- connection ---------------------------------------------------------
  let ws = null, authed = false, retry = 0, retryTimer = null;
  const dot = $("#dot"), state = $("#state");
  function setState(kind, text) {
    dot.className = "dot" + (kind ? " " + kind : "");
    state.textContent = text;
  }
  function send(obj) {
    if (ws && ws.readyState === 1 && authed) ws.send(JSON.stringify(obj));
  }
  function connect() {
    clearTimeout(retryTimer);
    if (!pin) { showPin(""); setState("bad", "needs PIN"); return; }
    setState("", "connecting…");
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/ws");
    ws.onopen = () => ws.send(JSON.stringify({ t: "auth", pin }));
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.t === "auth") {
        if (m.ok) {
          authed = true; retry = 0;
          if (m.host) $("#host").textContent = m.host;
          setState("ok", "connected");
          hidePin();
        } else {
          authed = false;
          setState("bad", m.locked ? "locked for a minute" : "wrong PIN");
          showPin(m.locked ? "Too many wrong tries. Wait a minute, then try again." : "That PIN did not match.");
          ws.close();
        }
      }
    };
    ws.onclose = () => {
      const wasAuthed = authed; authed = false;
      if ($("#pinSheet").classList.contains("show")) return;
      setState("", wasAuthed ? "reconnecting…" : "can't reach the Pi — retrying");
      retry = Math.min(retry + 1, 6);
      retryTimer = setTimeout(connect, 400 * retry);
    };
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && (!ws || ws.readyState > 1)) connect();
  });

  // ---- PIN sheet ----------------------------------------------------------
  function showPin(msg) {
    $("#pinErr").textContent = msg || "";
    $("#pinSheet").classList.add("show");
    setTimeout(() => $("#pinInput").focus(), 50);
  }
  function hidePin() { $("#pinSheet").classList.remove("show"); }
  $("#pinSave").onclick = () => {
    const v = $("#pinInput").value.trim();
    if (!/^\d{6}$/.test(v)) { $("#pinErr").textContent = "The PIN is six digits."; return; }
    pin = v; store.set("pin", v); hidePin(); connect();
  };
  $("#pinInput").addEventListener("keydown", e => { if (e.key === "Enter") $("#pinSave").click(); });

  // ---- settings sheet -----------------------------------------------------
  const sens = $("#sens"), natural = $("#natural");
  function paintPrefs() { sens.value = prefs.sens; $("#sensVal").textContent = (+prefs.sens).toFixed(1) + "×"; natural.checked = prefs.natural; }
  $("#gear").onclick = () => { paintPrefs(); $("#setSheet").classList.add("show"); };
  $("#setDone").onclick = () => $("#setSheet").classList.remove("show");
  sens.oninput = () => { prefs.sens = +sens.value; store.set("sens", prefs.sens); paintPrefs(); };
  natural.onchange = () => { prefs.natural = natural.checked; store.set("natural", prefs.natural); };
  $("#forget").onclick = () => { store.set("pin", ""); pin = ""; $("#setSheet").classList.remove("show"); if (ws) ws.close(); showPin(""); };

  // ---- keep the screen awake while in use ----------------------------------
  let wake = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.onrelease = () => wake = null; } } catch {}
  }

  // ---- trackpad -----------------------------------------------------------
  const pad = $("#pad"), mode = $("#mode");
  const TAP_MS = 230, SLOP = 9, DOUBLE_MS = 240, SCROLL_K = 4, MAX_STEP = 380;
  const pts = new Map();
  let maxPts = 0, moved = false, t0 = 0, pendingClick = null, secondTap = false, dragging = false;
  let accX = 0, accY = 0, accV = 0, accH = 0, frame = 0;

  function flushMotion() {
    frame = 0;
    let ix = Math.trunc(accX), iy = Math.trunc(accY);
    accX -= ix; accY -= iy;
    // The Pi caps one message at 400px; split a fast flick rather than lose distance.
    while (ix || iy) {
      const sx = Math.max(-MAX_STEP, Math.min(MAX_STEP, ix)), sy = Math.max(-MAX_STEP, Math.min(MAX_STEP, iy));
      send({ t: "m", dx: sx, dy: sy }); ix -= sx; iy -= sy;
    }
    const iv = Math.trunc(accV), ih = Math.trunc(accH);
    if (iv || ih) { send({ t: "s", v: iv, h: ih }); accV -= iv; accH -= ih; }
  }
  function schedule() { if (!frame) frame = requestAnimationFrame(flushMotion); }
  function showMode(text) { mode.textContent = text; mode.classList.toggle("show", !!text); }

  pad.addEventListener("pointerdown", e => {
    e.preventDefault();
    // Capture keeps the gesture alive if the finger slides off the pad. It is a
    // nicety: if the browser refuses it, the touch must still be tracked.
    try { pad.setPointerCapture(e.pointerId); } catch {}
    pad.classList.add("active", "used");
    keepAwake();
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
    if (pts.size === 1) {
      t0 = performance.now(); moved = false; maxPts = 1;
      // A second touch soon after a tap means drag (if it moves) or double-click (if it doesn't).
      if (pendingClick) { clearTimeout(pendingClick); pendingClick = null; secondTap = true; }
      else secondTap = false;
    }
    maxPts = Math.max(maxPts, pts.size);
  });

  pad.addEventListener("pointermove", e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    e.preventDefault();
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (!moved && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > SLOP) moved = true;
    if (!moved) return;

    if (pts.size === 1) {
      if (secondTap && !dragging) { dragging = true; send({ t: "b", b: "left", a: "down" }); showMode("drag"); }
      const speed = Math.hypot(dx, dy);
      const gain = prefs.sens * (1 + Math.min(speed, 40) / 14);   // gentle acceleration
      accX += dx * gain; accY += dy * gain;
    } else if (pts.size === 2) {
      showMode("scroll");
      const dir = prefs.natural ? 1 : -1;
      // Linux: positive wheel = scroll up. Natural scrolling follows the fingers.
      accV += dir * dy * SCROLL_K / 2;
      accH += -dir * dx * SCROLL_K / 2;
    }
    schedule();
  });

  function endPointer(e) {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size) return;
    pad.classList.remove("active");
    showMode("");
    flushMotion();
    const quick = performance.now() - t0 < TAP_MS;
    if (dragging) {
      dragging = false; send({ t: "b", b: "left", a: "up" });
    } else if (!moved && quick) {
      if (maxPts >= 2) send({ t: "b", b: "right", a: "click" });
      else if (secondTap) send({ t: "b", b: "left", a: "double" });
      else pendingClick = setTimeout(() => { pendingClick = null; send({ t: "b", b: "left", a: "click" }); }, DOUBLE_MS);
    }
    secondTap = false;
  }
  pad.addEventListener("pointerup", endPointer);
  pad.addEventListener("pointercancel", endPointer);
  pad.addEventListener("contextmenu", e => e.preventDefault());

  // ---- physical buttons ---------------------------------------------------
  document.querySelectorAll(".btn[data-btn]").forEach(b => {
    const name = b.dataset.btn;
    b.addEventListener("pointerdown", e => { e.preventDefault(); b.classList.add("down"); send({ t: "b", b: name, a: "down" }); });
    const up = () => { if (!b.classList.contains("down")) return; b.classList.remove("down"); send({ t: "b", b: name, a: "up" }); };
    b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("pointerleave", up);
  });
  const hold = $("#hold");
  hold.addEventListener("click", () => {
    const on = !hold.classList.contains("on");
    hold.classList.toggle("on", on);
    send({ t: "b", b: "left", a: on ? "down" : "up" });
  });

  // ---- keyboard -----------------------------------------------------------
  const mods = new Set();
  function paintMods() { document.querySelectorAll(".k.mod").forEach(k => k.classList.toggle("on", mods.has(k.dataset.mod))); }
  function takeMods() { const m = [...mods]; mods.clear(); paintMods(); return m; }

  document.querySelectorAll(".k.mod").forEach(k => k.addEventListener("click", () => {
    const m = k.dataset.mod; mods.has(m) ? mods.delete(m) : mods.add(m); paintMods();
  }));
  document.querySelectorAll(".k[data-key]").forEach(k => k.addEventListener("click", () => {
    send({ t: "key", key: k.dataset.key, mods: takeMods() });
    k.classList.add("flash"); setTimeout(() => k.classList.remove("flash"), 120);
  }));

  // The phone's own keyboard. The field always holds two invisible characters,
  // so Backspace has something to delete even when nothing has been typed —
  // that is how a delete is detected on iOS, which sends no key event for it.
  const box = $("#type"), SENT = "​​", kbd = $("#kbd");
  function reset() { box.value = SENT; box.setSelectionRange(SENT.length, SENT.length); }
  reset();
  box.addEventListener("input", () => {
    const v = box.value;
    if (v.length < SENT.length) {
      for (let i = 0; i < SENT.length - v.length; i++) send({ t: "key", key: "Backspace", mods: takeMods() });
    } else {
      const added = (v.startsWith(SENT) ? v.slice(SENT.length) : v).replace(/​/g, "");
      if (added) {
        if (mods.size && added.length === 1) send({ t: "key", key: added, mods: takeMods() });
        else send({ t: "text", text: added });
      }
    }
    reset();
  });
  kbd.addEventListener("click", () => {
    if (document.activeElement === box) { box.blur(); return; }
    reset(); box.focus();
  });
  box.addEventListener("focus", () => { kbd.classList.add("open"); kbd.setAttribute("aria-label", "Hide keyboard"); });
  box.addEventListener("blur", () => { kbd.classList.remove("open"); kbd.setAttribute("aria-label", "Show keyboard"); });

  connect();
})();
</script>
</body>
</html>
