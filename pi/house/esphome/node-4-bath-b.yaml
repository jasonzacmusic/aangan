# AANGAN · NODE 4 — BATHROOMS B + WASHING MACHINE  (sticker: 4)
#
# Board MAC 00:70:07:a2:90:dc
#
# The second of the two bathroom boards. Node 3 takes the pair of bathrooms
# closest together plus the geyser; this one takes the remaining two, plus the
# washing machine area. Which pair goes where is decided on the day — pick
# whichever two are nearest each other and the firmware does not care.
#
# WIRING — each probe goes between its pin and GND:
#   GPIO25  bathroom B1 floor
#   GPIO26  bathroom B2 floor
#   GPIO27  washing machine floor / drain
#
# And one extra sensor this board can take with parts already in hand:
#   GPIO32  SW-420 vibration module D0  — tells you the washing machine has
#           finished its cycle. Module needs 3.3V or 5V + GND as well.
#
# Keep the ESP32 and the small probe boards DRY and high. Only the flat comb
# goes on the floor.
#
# Power: one 5V USB charger (micro-USB).
esphome:
  name: node-4-bath-b
  friendly_name: 4 Bathrooms B

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key_perimeter
  reboot_timeout: 0s   # no Home Assistant in this setup

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 5min
  ap:
    ssid: "node-4 setup"
    password: !secret ap_password
captive_portal:

web_server:
  port: 80

binary_sensor:
  - platform: gpio
    name: "Bathroom B1 leak"
    pin: { number: GPIO25, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Bathroom B2 leak"
    pin: { number: GPIO26, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Washing machine leak"
    pin: { number: GPIO27, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]

  # Washing machine vibration. Held on for 3 minutes after the last shake so a
  # pause between cycles does not read as "finished".
  - platform: gpio
    name: "Washing machine running"
    pin: { number: GPIO32, mode: { input: true, pullup: true }, inverted: true }
    device_class: vibration
    filters:
      - delayed_on: 2s
      - delayed_off: 180s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      on_value:
        then:
          - logger.log:
              level: INFO
              format: "AANGAN READY - open http://%s/ on any phone"
              args: ["x.c_str()"]
