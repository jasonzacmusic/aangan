# AI-Thinker ESP32-CAM — entrance snapshot for Aangan and Home Assistant.
# First flash needs a USB-to-serial adapter: 5V, GND, U0R↔TX, U0T↔RX, and
# GPIO0 to GND only while flashing. Remove GPIO0-to-GND, then reset to boot.

esphome:
  name: doorbell-cam
  friendly_name: Doorbell Cam

esp32:
  board: esp32cam
  framework:
    type: esp-idf

psram:

logger:
api:
  encryption:
    key: !secret api_key_doorbell_cam
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "doorbell-cam setup"
    password: !secret ap_password
captive_portal:

i2c:
  - id: camera_i2c
    sda: GPIO26
    scl: GPIO27

esp32_camera:
  name: "Entrance"
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_id: camera_i2c
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 640x480
  jpeg_quality: 12
  max_framerate: 5 fps
  idle_framerate: 0.1 fps

binary_sensor:
  - platform: status
    name: "Doorbell camera online"
