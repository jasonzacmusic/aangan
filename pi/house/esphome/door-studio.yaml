# AANGAN · STUDIO DOOR UNIT — "ledESP"  (label this board ledESP)
#
# THIS is the canonical door board as of 20 Aug 2026. Any other ESP32 flashed
# with this config earlier is superseded — ignore it, or it will fight for
# 192.168.0.248. The 7" Waveshare panel, when it arrives, replaces THIS chip:
# reflash it with this same file plus the display block. Do not add a third
# computer at the door.
#
# Spare ESP32, MAC 68:09:47:9d:b7:c4, static IP 192.168.0.248.
# This is NOT one of the six room nodes. Copper stays in the studio.
#
# DATA PATH (Wi-Fi, not USB):
#   Board 1 (192.168.0.250) broadcasts dBA + door reeds + leak over ESP-NOW
#   every 100 ms, and also serves HTTP JSON at /text_sensor/studio_live.
#   This chip listens on ESP-NOW first. HTTP poll is the fallback for when
#   the house mesh stops isolating clients.
#   USB one-line commands still work as a bench overlay (STATE from the app).
#
# Married warnings from the paper: puck colour + (later) 7" plate. Same state.
# Acoustic: rest with AC on is 42 dBA; hall WAIT trips at 52 dBA.
# Rec / class / SOS from STATE still win over the mic.
#
# The 7" picture lives in Studio Command at /#/display/front-studio until the
# Waveshare ESP32-S3 panel is on the lintel. That panel *is* this door chip
# (do not add a third computer). Reflash it with the same Wi-Fi contract.
#
# WIRING (bulb — do not power the ring from the ESP 3V3 pin):
#   GPIO2   onboard LED
#   GPIO4   WS2812 DIN  (5 V + GND from the USB PSU, grounds joined;
#           74AHCT125 level shifter before a long run)
#   12 LEDs assumed for a puck/ring.

substitutions:
  # Where the app parks the studio state for this board to collect.
  # The board polls OUT over https, which is the only direction that works:
  # an https page may not read this http board, and the house mesh does not
  # reliably pass client-to-client traffic. Change this one line if the app
  # ever moves to a branded domain.
  relay_url: "https://aangan.nathanielschool.com/api/door"

esphome:
  name: door-studio
  friendly_name: Studio door
  # Without this the puck sits dark until data arrives or a button is pressed,
  # which reads as broken wiring. -100 runs last, after the light exists.
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - script.execute: apply_hall

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 115200   # TEMP: diagnosing wifi. Back to 0 once solved.
  level: INFO

api:
  encryption:
    key: !secret api_key_studio_sense
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 5min
  manual_ip:
    static_ip: 192.168.0.248
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  ap:
    ssid: "door-studio setup"
    password: !secret ap_password
captive_portal:

web_server:
  port: 80

json:

http_request:
  timeout: 1s
  watchdog_timeout: 15s
  verify_ssl: false   # payload is one public word; a CA bundle costs flash for nothing

espnow:
  auto_add_peer: true
  peers:
    - "8C:94:DF:69:20:20"

packet_transport:
  - platform: espnow
    providers:
      - name: room-studio
        encryption: "AanganDoor1"

globals:
  # Epoch-ms of the newest relay value this board has accepted. Serverless
  # instances come and go, and a blank one would otherwise talk the light back
  # to "available" out of pure ignorance. Only a strictly newer stamp is
  # believed, so a cold instance (which reports 0) can never win.
  - id: g_relay_at
    type: double
    restore_value: no
    initial_value: '0'

  - id: g_state
    type: std::string
    restore_value: no
    initial_value: '"available"'
  - id: g_dba
    type: float
    restore_value: no
    initial_value: "42"
  - id: g_warn
    type: float
    restore_value: no
    initial_value: "52"
  - id: g_door_test
    type: bool
    restore_value: no
    initial_value: "false"
  - id: g_http_ok
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: apply_hall
    mode: restart
    then:
      - lambda: |-
          std::string st = id(g_state);
          float dba = id(g_dba);
          bool door_open = id(remote_g1).state || id(remote_g2).state || id(g_door_test);
          bool recording = (st == "audio_rec" || st == "video_rec");
          bool too_loud  = (!isnan(dba) && dba >= id(g_warn));

          // Jason's rules, 20 Aug:
          //   recording          -> solid red
          //   door open mid-take -> red, FAST flash   (most urgent)
          //   too loud mid-take  -> red, SLOW pulse
          //   class              -> amber
          //   available          -> dim green
          //   emergency          -> purple, overrides everything
          unsigned long rgb = 0x2FBF71;   // green
          float bright      = 0.22f;      // dim when nothing is happening
          const char *fx    = "None";
          const char *visual = "ok";
          const char *mark   = "OK";

          if (st == "emergency") {
            rgb = 0x7C3AED; bright = 1.0f; fx = "fast_flash";
            visual = "sos";  mark = "SOS";
          } else if (recording) {
            rgb = 0xD93036; bright = 1.0f;
            visual = "onair"; mark = "ON AIR";
            if (door_open) {            // urgent beats loud
              fx = "fast_flash"; visual = "door"; mark = "DOOR OPEN";
            } else if (too_loud) {
              fx = "slow_pulse"; visual = "loud"; mark = "TOO LOUD";
            }
          } else if (st == "class" || st == "meeting") {
            rgb = 0xF5A623; bright = 0.85f;
            visual = "wait"; mark = "WAIT";
          } else if (too_loud) {
            rgb = 0xF5A623; bright = 0.85f;
            visual = "loud"; mark = "WAIT";
          }

          float r = ((rgb >> 16) & 0xFF) / 255.0f;
          float g = ((rgb >> 8) & 0xFF) / 255.0f;
          float b = (rgb & 0xFF) / 255.0f;
          auto puck = id(door_puck).turn_on();
          puck.set_rgb(r, g, b);
          puck.set_brightness(bright);
          puck.set_effect(fx);
          puck.perform();
          auto led = id(door_led).turn_on();
          led.set_brightness(r > g ? (r > b ? r : b) : (g > b ? g : b));
          led.perform();
          char dba_s[16];
          if (isnan(dba)) snprintf(dba_s, sizeof(dba_s), "--");
          else snprintf(dba_s, sizeof(dba_s), "%.1f", dba);
          id(door_dba).publish_state(dba_s);
          id(door_state).publish_state(st);
          id(door_visual).publish_state(visual);
          id(door_mark).publish_state(mark);

# USB overlay so Studio Command can still set rec / class from this Mac.
uart:
  id: usb_cmd
  baud_rate: 115200
  tx_pin: GPIO1
  rx_pin: GPIO3
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\n"
    sequence:
      - lambda: |-
          std::string line(bytes.begin(), bytes.end());
          while (!line.empty() && (line.back() == '\r' || line.back() == '\n' || line.back() == ' '))
            line.pop_back();
          if (line.empty()) return;
          if (line.rfind("COLOR ", 0) == 0) {
            std::string hex = line.substr(6);
            if (!hex.empty() && hex[0] == '#') hex.erase(0, 1);
            if (hex.size() >= 6) {
              unsigned long n = strtoul(hex.c_str(), nullptr, 16);
              float r = ((n >> 16) & 0xFF) / 255.0f;
              float g = ((n >> 8) & 0xFF) / 255.0f;
              float b = (n & 0xFF) / 255.0f;
              auto puck = id(door_puck).turn_on();
              puck.set_rgb(r, g, b);
              puck.set_brightness(1.0f);
              puck.perform();
            }
          } else if (line.rfind("TEXT ", 0) == 0) {
            id(door_ticker).publish_state(line.substr(5));
          } else if (line.rfind("STATE ", 0) == 0) {
            id(g_state) = line.substr(6);
            id(apply_hall).execute();
          } else if (line.rfind("VISUAL ", 0) == 0) {
            id(door_visual).publish_state(line.substr(7));
          } else if (line.rfind("MARK ", 0) == 0) {
            id(door_mark).publish_state(line.substr(5));
          } else if (line.rfind("DBA ", 0) == 0) {
            id(g_dba) = atof(line.substr(4).c_str());
            id(apply_hall).execute();
          } else if (line.rfind("DOOR ", 0) == 0) {
            id(door_leaf).publish_state(line.substr(5));
          }

output:
  - platform: ledc
    pin: GPIO2
    id: onboard_pwm

light:
  - platform: monochromatic
    name: "Door onboard LED"
    id: door_led
    output: onboard_pwm
    restore_mode: ALWAYS_OFF
  - platform: esp32_rmt_led_strip
    name: "Door puck"
    id: door_puck
    pin: GPIO4
    num_leds: 12
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      # Too loud mid-take: a slow breath. Noticeable, not alarming.
      - pulse:
          name: slow_pulse
          transition_length: 900ms
          update_interval: 1800ms
          min_brightness: 25%
          max_brightness: 100%
      # Door open mid-take: fast and urgent. Someone is about to walk in.
      - pulse:
          name: fast_flash
          transition_length: 100ms
          update_interval: 220ms
          min_brightness: 0%
          max_brightness: 100%

sensor:
  - platform: packet_transport
    provider: room-studio
    remote_id: studio_dba
    id: remote_dba
    name: "Door heard dBA"
    internal: false
    unit_of_measurement: "dBA"
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: |-
            id(g_dba) = x;
            id(g_http_ok) = true;
        - script.execute: apply_hall

binary_sensor:
  - platform: packet_transport
    provider: room-studio
    remote_id: door_g1
    id: remote_g1
    name: "Door heard G1"
    internal: false
    on_state:
      then:
        - lambda: |-
            bool open = id(remote_g1).state || id(remote_g2).state;
            id(door_leaf).publish_state(open ? "OPEN" : "SHUT");
        - script.execute: apply_hall
  - platform: packet_transport
    provider: room-studio
    remote_id: door_g2
    id: remote_g2
    name: "Door heard G2"
    internal: false
    on_state:
      then:
        - lambda: |-
            bool open = id(remote_g1).state || id(remote_g2).state;
            id(door_leaf).publish_state(open ? "OPEN" : "SHUT");
        - script.execute: apply_hall
  - platform: packet_transport
    provider: room-studio
    remote_id: studio_sink_leak
    id: remote_leak
    name: "Door heard leak"
    internal: false

interval:
  # Studio state from the app, over the internet. 3s, not faster: this is a
  # serverless call, and every second shaved off multiplies the monthly
  # invocation count. 3s is ~860k/month, inside the included allowance, and a
  # human pressing a button cannot tell it from instant. Door-open and
  # too-loud do not wait on this — those arrive on ESP-NOW in milliseconds.
  # Studio state from the app, over the internet. This is the road that works
  # from a phone on mobile data, with the Mac off, and through a mesh that will
  # not pass client-to-client traffic. Anything other than a clean 200 with a
  # known state is ignored, so a redirect to a login page or a flat network
  # simply leaves the light where it was.
  - interval: 3s
    then:
      - if:
          condition:
            wifi.connected
          then:
            - http_request.get:
                url: ${relay_url}
                capture_response: true
                max_response_buffer_size: 256
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) return;
                        json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["state"].is<const char*>()) return false;
                          // Stamp of 0, missing, or not newer than what we
                          // already have means this instance knows less than
                          // we do. Say nothing and wait for a better answer.
                          double at = root["at"].is<double>() ? root["at"].as<double>() : 0.0;
                          if (at <= id(g_relay_at)) return false;
                          id(g_relay_at) = at;
                          std::string next = root["state"].as<std::string>();
                          if (next.empty() || next == id(g_state)) return false;
                          id(g_state) = next;
                          id(apply_hall).execute();
                          return true;
                        });

  # Heartbeat: re-apply the light every 10s so it is self-healing if a
  # trigger is ever missed. apply_hall is idempotent.
  - interval: 10s
    then:
      - script.execute: apply_hall
  - interval: 400ms
    then:
      - if:
          condition:
            wifi.connected
          then:
            - http_request.get:
                url: http://192.168.0.250/sensor/studio_sound_level
                capture_response: true
                max_response_buffer_size: 512
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) return;
                        json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["value"]) return false;
                          id(g_dba) = root["value"];
                          id(g_http_ok) = true;
                          return true;
                        });
                        id(apply_hall).execute();

text_sensor:
  - platform: template
    name: "Door ticker"
    id: door_ticker
  - platform: template
    name: "Door studio state"
    id: door_state
  - platform: template
    name: "Door visual"
    id: door_visual
  - platform: template
    name: "Door mark"
    id: door_mark
  - platform: template
    name: "Door dBA"
    id: door_dba
  - platform: template
    name: "Door leaf"
    id: door_leaf
  - platform: wifi_info
    ip_address:
      name: "IP address"


# ---------------------------------------------------------------------------
# BENCH CONTROLS. These drive the same code path as the real ESP-NOW data, so
# what you see here is exactly what the door will do. Harmless to leave in.
# ---------------------------------------------------------------------------
select:
  - platform: template
    name: "Studio state"
    id: test_state
    optimistic: true
    options: ["available", "class", "meeting", "audio_rec", "video_rec", "emergency"]
    initial_option: "available"
    on_value:
      then:
        - lambda: 'id(g_state) = x;'
        - script.execute: apply_hall

button:
  - platform: template
    name: "Test room too loud"
    on_press:
      then:
        - lambda: 'id(g_dba) = 60.0;'
        - script.execute: apply_hall
  - platform: template
    name: "Test room quiet"
    on_press:
      then:
        - lambda: 'id(g_dba) = 40.0;'
        - script.execute: apply_hall
  - platform: template
    name: "Test door open"
    on_press:
      then:
        - lambda: 'id(g_door_test) = true;'
        - script.execute: apply_hall
  - platform: template
    name: "Test door shut"
    on_press:
      then:
        - lambda: 'id(g_door_test) = false;'
        - script.execute: apply_hall
