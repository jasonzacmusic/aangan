# AANGAN · STUDIO DOOR UNIT — "ledESP"  (label this board ledESP)
#
# This is the LED half of the door: a plain ESP32 driving the WS2812 strip.
# The 7" Waveshare panel is a separate S3 with door-display.yaml. There is no
# wire between them; both poll the same public relay state.
#
# Spare ESP32, MAC 68:09:47:9d:b7:c4, on DHCP.
# This is NOT one of the six room nodes. Copper stays in the studio.
#
# DATA PATH (Wi-Fi, not USB):
#   Board 1 broadcasts dBA + door reeds + leak over ESP-NOW every 100 ms.
#   This chip receives those facts over ESP-NOW. There is deliberately no HTTP
#   fallback: ESPHome HTTP is blocking, and a missing room board used to freeze
#   this light for a full timeout every 400 ms.
#
# Married warnings from the paper: puck colour + (later) 7" plate. Same state.
# Acoustic: rest with AC on is 42 dBA; hall WAIT trips at 52 dBA.
# Rec / class / SOS from STATE still win over the mic.
#
# The 7" picture lives in Studio Command at /#/display/front-studio until the
# Waveshare ESP32-S3 panel is on the lintel. That panel *is* this door chip
# (do not add a third computer). Reflash it with the same Wi-Fi contract.
#
# WIRING (bulb — do not power the ring from the ESP 3V3 pin):
#   GPIO2   onboard LED
#   GPIO4   WS2812 DIN  (5 V + GND from the USB PSU, grounds joined;
#           74AHCT125 level shifter before a long run)
#   12 LEDs assumed for a puck/ring.

substitutions:
  # Where the app parks the studio state for this board to collect.
  # The board polls OUT over https, which is the only direction that works:
  # an https page may not read this http board, and the house mesh does not
  # reliably pass client-to-client traffic. Change this one line if the app
  # ever moves to a branded domain.
  relay_url: "https://aangan.nathanielschool.com/api/door"

esphome:
  name: door-studio
  friendly_name: Studio door
  # Without this the puck sits dark until data arrives or a button is pressed,
  # which reads as broken wiring. -100 runs last, after the light exists.
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - script.execute: apply_hall

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 115200
  level: INFO

api:
  encryption:
    key: !secret api_key_studio_sense
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 5min
  # DHCP, deliberately. This board had a static IP from the days when the app
  # talked to it directly; nothing connects TO it any more, it only makes
  # outbound calls, so the fixed address bought nothing. It cost plenty though:
  # with manual_ip, ESP-IDF's resolver kept failing with
  #   couldn't get hostname for aangan.nathanielschool.com: getaddrinfo()
  # after working for a few minutes. DHCP hands over working DNS with the lease.
  # If a fixed address is ever needed again, reserve it on the router instead.
  ap:
    ssid: "door-studio setup"
    password: !secret ap_password
captive_portal:

web_server:
  port: 80

json:

http_request:
  # Two opposing pressures, and this number is the compromise.
  #
  # Too short and TLS cannot finish: at 1s every request died mid-handshake with
  # ESP_ERR_HTTP_CONNECT, because a handshake to a CDN on a 240 MHz chip takes
  # seconds, not milliseconds. The board was working perfectly and was simply
  # never given time to shake hands.
  #
  # Too long and a FAILED request freezes the board, because ESPHome's http
  # client is blocking — at 10s the log showed "interval took a long time for an
  # operation (10011 ms)". Ten seconds of a frozen board means ten seconds where
  # a door opening mid-take does not flash the light. That is the whole point of
  # the device, so the stall is the thing to bound, not the latency.
  #
  # 4s was too tight and every single handshake died in it. The stall is still
  # worth bounding, but a light that never updates is worse than one that
  # hesitates, so: 8s to finish the handshake, and the poll below slowed to 5s
  # so a slow call cannot collide with the next attempt.
  # Measured behaviour: at 4s every handshake died, at 8s nearly all did, and at
  # 10s some got through. So the handshake genuinely wants close to ten seconds.
  # 12s gives it room. The blocking stall this creates is the real problem with
  # polling https from this chip at all — see the note on MQTT in INVENTORY.md.
  timeout: 12s
  watchdog_timeout: 30s
  verify_ssl: false   # payload is one public word; a CA bundle costs flash for nothing

espnow:
  auto_add_peer: true
  peers:
    - "8C:94:DF:69:20:20"

packet_transport:
  - platform: espnow
    providers:
      - name: room-studio
        encryption: "AanganDoor1"

globals:
  # Epoch-ms of the newest relay value this board has accepted. Serverless
  # instances come and go, and a blank one would otherwise talk the light back
  # to "available" out of pure ignorance. Only a strictly newer stamp is
  # believed, so a cold instance (which reports 0) can never win.
  - id: g_relay_at
    type: double
    restore_value: no
    initial_value: '0'

  - id: g_state
    type: std::string
    restore_value: no
    initial_value: '"available"'
  - id: g_dba
    type: float
    restore_value: no
    # Unknown until room-studio actually sends a sensor reading. A plausible
    # placeholder looked like real telemetry in the app and hid a dead sensor.
    initial_value: "NAN"
  - id: g_warn
    type: float
    restore_value: no
    initial_value: "52"
  - id: g_door_test
    type: bool
    restore_value: no
    initial_value: "false"
  - id: g_http_ok
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: apply_hall
    mode: restart
    then:
      - lambda: |-
          std::string st = id(g_state);
          float dba = id(g_dba);
          bool door_open = id(remote_g1).state || id(remote_g2).state || id(g_door_test);
          bool recording = (st == "audio_rec" || st == "video_rec");
          bool too_loud  = (!isnan(dba) && dba >= id(g_warn));

          // Jason's rules, 20 Aug:
          //   recording          -> solid red
          //   door open mid-take -> red, FAST flash   (most urgent)
          //   too loud mid-take  -> red, SLOW pulse
          //   class              -> amber
          //   available          -> dim green
          //   emergency          -> purple, overrides everything
          unsigned long rgb = 0x2FBF71;   // green
          float bright      = 0.22f;      // dim when nothing is happening
          const char *fx    = "None";
          const char *visual = "ok";
          const char *mark   = "OK";

          if (st == "emergency") {
            rgb = 0x7C3AED; bright = 1.0f; fx = "fast_flash";
            visual = "sos";  mark = "SOS";
          } else if (recording) {
            rgb = 0xD93036; bright = 1.0f;
            visual = "onair"; mark = "ON AIR";
            if (door_open) {            // urgent beats loud
              fx = "fast_flash"; visual = "door"; mark = "DOOR OPEN";
            } else if (too_loud) {
              fx = "slow_pulse"; visual = "loud"; mark = "TOO LOUD";
            }
          } else if (st == "class" || st == "meeting") {
            rgb = 0xF5A623; bright = 0.85f;
            visual = "wait"; mark = "WAIT";
          }

          float r = ((rgb >> 16) & 0xFF) / 255.0f;
          float g = ((rgb >> 8) & 0xFF) / 255.0f;
          float b = (rgb & 0xFF) / 255.0f;
          auto puck = id(door_puck).turn_on();
          puck.set_rgb(r, g, b);
          puck.set_brightness(bright);
          puck.set_effect(fx);
          puck.perform();
          auto led = id(door_led).turn_on();
          led.set_brightness(r > g ? (r > b ? r : b) : (g > b ? g : b));
          led.perform();
          char dba_s[16];
          if (isnan(dba)) snprintf(dba_s, sizeof(dba_s), "--");
          else snprintf(dba_s, sizeof(dba_s), "%.1f", dba);
          id(door_dba).publish_state(dba_s);
          id(door_state).publish_state(st);
          id(door_visual).publish_state(visual);
          id(door_mark).publish_state(mark);

# The USB command overlay used to live here: a uart on GPIO1/GPIO3 that let
# the Mac push colours down the serial cable. It is gone deliberately.
#
# GPIO1 and GPIO3 ARE the USB serial port. Claiming them for anything else
# means this board can never print a boot log, which is why logging had to
# be switched off and why a board that would not join Wi-Fi could not be
# diagnosed at all. The app now reaches the light over Wi-Fi and through
# the relay, so nothing needs the cable. Do not put a uart back on these
# two pins.

output:
  - platform: ledc
    pin: GPIO2
    id: onboard_pwm

light:
  - platform: monochromatic
    name: "Door onboard LED"
    id: door_led
    output: onboard_pwm
    restore_mode: ALWAYS_OFF
  - platform: esp32_rmt_led_strip
    name: "Door puck"
    id: door_puck
    pin: GPIO4
    num_leds: 12
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      # Too loud mid-take: a slow breath. Noticeable, not alarming.
      - pulse:
          name: slow_pulse
          transition_length: 900ms
          update_interval: 1800ms
          min_brightness: 25%
          max_brightness: 100%
      # Door open mid-take: fast and urgent. Someone is about to walk in.
      - pulse:
          name: fast_flash
          transition_length: 100ms
          update_interval: 220ms
          min_brightness: 0%
          max_brightness: 100%

sensor:
  # Signal strength, so "the handshake is slow" can be told apart from "this
  # board is sitting at the far edge of the mesh".
  - platform: wifi_signal
    name: "Door wifi signal"
    id: door_rssi
    update_interval: 30s
    on_value:
      then:
        - logger.log:
            level: INFO
            format: "WIFI %.0f dBm (weaker than -75 explains slow TLS)"
            args: ["x"]

  - platform: packet_transport
    provider: room-studio
    remote_id: studio_dba
    id: remote_dba
    name: "Door heard dBA"
    internal: false
    unit_of_measurement: "dBA"
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: |-
            id(g_dba) = x;
            id(g_http_ok) = true;
        - script.execute: apply_hall

binary_sensor:
  - platform: packet_transport
    provider: room-studio
    remote_id: door_g1
    id: remote_g1
    name: "Door heard G1"
    internal: false
    on_state:
      then:
        - lambda: |-
            bool open = id(remote_g1).state || id(remote_g2).state;
            id(door_leaf).publish_state(open ? "OPEN" : "SHUT");
        - script.execute: apply_hall
  - platform: packet_transport
    provider: room-studio
    remote_id: door_g2
    id: remote_g2
    name: "Door heard G2"
    internal: false
    on_state:
      then:
        - lambda: |-
            bool open = id(remote_g1).state || id(remote_g2).state;
            id(door_leaf).publish_state(open ? "OPEN" : "SHUT");
        - script.execute: apply_hall
  - platform: packet_transport
    provider: room-studio
    remote_id: studio_sink_leak
    id: remote_leak
    name: "Door heard leak"
    internal: false

interval:
  # Studio state from the app, over the internet. 3s, not faster: this is a
  # serverless call, and every second shaved off multiplies the monthly
  # invocation count. 3s is ~860k/month, inside the included allowance, and a
  # human pressing a button cannot tell it from instant. Door-open and
  # too-loud do not wait on this — those arrive on ESP-NOW in milliseconds.
  # Studio state from the app, over the internet. This is the road that works
  # from a phone on mobile data, with the Mac off, and through a mesh that will
  # not pass client-to-client traffic. Anything other than a clean 200 with a
  # known state is ignored, so a redirect to a login page or a flat network
  # simply leaves the light where it was.
  - interval: 15s
    then:
      - if:
          condition:
            wifi.connected
          then:
            - http_request.post:
                url: ${relay_url}
                capture_response: true
                max_response_buffer_size: 256
                request_headers:
                  Content-Type: application/json
                # Reporting and collecting in the same call. What this board can
                # see about the door and the room reaches the sign nowhere else
                # — it arrives on ESP-NOW and dies here otherwise.
                json: |-
                  root["visual"] = id(door_visual).state;
                  root["dba"] = id(g_dba);
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) return;
                        json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["state"].is<const char*>()) return false;
                          // Stamp of 0, missing, or not newer than what we
                          // already have means this instance knows less than
                          // we do. Say nothing and wait for a better answer.
                          double at = root["at"].is<double>() ? root["at"].as<double>() : 0.0;
                          if (at <= id(g_relay_at)) return false;
                          id(g_relay_at) = at;
                          std::string next = root["state"].as<std::string>();
                          if (next.empty() || next == id(g_state)) return false;
                          id(g_state) = next;
                          id(apply_hall).execute();
                          return true;
                        });

  # Heartbeat: re-apply the light every 10s so it is self-healing if a
  # trigger is ever missed. apply_hall is idempotent.
  - interval: 10s
    then:
      - script.execute: apply_hall
text_sensor:
  - platform: template
    name: "Door ticker"
    id: door_ticker
  - platform: template
    name: "Door studio state"
    id: door_state
  - platform: template
    name: "Door visual"
    id: door_visual
  - platform: template
    name: "Door mark"
    id: door_mark
  - platform: template
    name: "Door dBA"
    id: door_dba
  - platform: template
    name: "Door leaf"
    id: door_leaf
  - platform: wifi_info
    ip_address:
      name: "IP address"


# ---------------------------------------------------------------------------
# BENCH CONTROLS. These drive the same code path as the real ESP-NOW data, so
# what you see here is exactly what the door will do. Harmless to leave in.
# ---------------------------------------------------------------------------
select:
  - platform: template
    name: "Studio state"
    id: test_state
    optimistic: true
    options: ["available", "class", "meeting", "audio_rec", "video_rec", "emergency"]
    initial_option: "available"
    on_value:
      then:
        - lambda: 'id(g_state) = x;'
        - script.execute: apply_hall

button:
  - platform: template
    name: "Test room too loud"
    on_press:
      then:
        - lambda: 'id(g_dba) = 60.0;'
        - script.execute: apply_hall
  - platform: template
    name: "Test room quiet"
    on_press:
      then:
        - lambda: 'id(g_dba) = 40.0;'
        - script.execute: apply_hall
  - platform: template
    name: "Test door open"
    on_press:
      then:
        - lambda: 'id(g_door_test) = true;'
        - script.execute: apply_hall
  - platform: template
    name: "Test door shut"
    on_press:
      then:
        - lambda: 'id(g_door_test) = false;'
        - script.execute: apply_hall
