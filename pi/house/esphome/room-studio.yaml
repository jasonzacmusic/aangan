# AANGAN · ROOM NODE — RECORDING STUDIO
#
# Grouped by ROOM, not by function. Wi-Fi unifies the data; it does not unify
# the wires. Every sensor here is physically cabled to this board, so the board
# lives IN the studio and no cable leaves the room.
#
# Replaces the studio half of studio-doors.yaml + studio-sense.yaml.
#
# WIRING (all sensors within a couple of metres of the board):
#   GPIO25  studio door, G1 hall side   reed between pin and GND
#   GPIO26  studio door, G2 hall side   reed between pin and GND
#   The studio is the connector between the two flats, so it has a door on
#   each side and each one gets its own reed.
#   GPIO27  studio sink leak probe  probe between pin and GND
#   GPIO34  SEN0232 sound meter     signal wire; sensor takes 5V + GND
#   GPIO16/17  LD2410 presence      LD2410 TX->16, RX->17; 5V + GND
#
# Power: one 5V USB charger. No mains work, no electrician.
esphome:
  name: room-studio
  friendly_name: Studio
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - lambda: |-
          ESP_LOGI("main", "DOOR G1 %s", id(door_g1).state ? "OPEN" : "SHUT");
          ESP_LOGI("main", "DOOR G2 %s", id(door_g2).state ? "OPEN" : "SHUT");
          ESP_LOGI("main", "LEAK %s", id(studio_sink_leak).state ? "WET" : "DRY");

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key_studio_sense
  reboot_timeout: 0s   # no Home Assistant in this setup; do NOT reboot waiting for one

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # 4-AP mesh drops the association otherwise
  reboot_timeout: 5min
  # Fixed address. DHCP moved this node three times in two days (.158, .169,
  # .179), which broke every bookmark and wasted a lot of time. 250 is chosen
  # to sit above the router's DHCP pool — observed leases only reach .179.
  manual_ip:
    static_ip: 192.168.0.250
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  ap:
    ssid: "room-studio setup"
    password: !secret ap_password
captive_portal:

web_server:
  port: 80

# Door unit at 192.168.0.248 (MAC 68:09:47:9d:b7:c4). Sensor numbers leave
# this room over Wi-Fi, not copper. ESP-NOW is the live path (the house mesh
# still isolates HTTP clients). HTTP REST on this web_server is the fallback
# once client isolation is turned off.
espnow:
  auto_add_peer: true
  peers:
    - "68:09:47:9D:B7:C4"

# KEEP: HLK-LD2410 presence. Pins reserved. Jason solders and plugs this later.
# Do not remove the uart / ld2410 / "Studio presence" block to "clean up" unused hardware.
uart:
  id: ld2410_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: ld2410_uart

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  # KEEP: GY-SHT31-D temperature + humidity. Needs header soldering, then it
  # just works on this I²C bus. Do not remove. heater_enabled off because the
  # Robu boards are clones that reject the heater command.
  - platform: sht3xd
    address: 0x44
    heater_enabled: false
    temperature:
      name: "Studio temperature"
      accuracy_decimals: 1
    humidity:
      name: "Studio humidity"
      id: studio_rh
      accuracy_decimals: 1
    update_interval: 30s

  # DFRobot SEN0232: 0.6-2.6 V spans 30-130 dBA, so dBA = volts x 50.
  # Door reeds are instant because they are a pin change. Sound is analog, so
  # the only way to match that feel is: one ADC read, no software average.
  # A slower copy for the recording gate can be added later — not this sensor.
  - platform: adc
    pin: GPIO34
    name: "Studio sound level"
    id: studio_dba
    unit_of_measurement: "dBA"
    device_class: sound_pressure
    attenuation: 12db
    samples: 1
    update_interval: 20ms
    filters:
      - multiply: 50.0
    accuracy_decimals: 1
    on_value:
      then:
        - logger.log:
            level: INFO
            format: "SOUND %.1f dBA"
            args: ["x"]

binary_sensor:
  # NOT inverted. Reed closed (magnet present, door shut) pulls the pin to GND,
  # which reads as closed. Confirm on the bench with the first reed before the
  # other three are trusted.
  - platform: gpio
    name: "Studio door - G1 side"
    id: door_g1
    pin: { number: GPIO25, mode: { input: true, pullup: true } }
    device_class: door
    filters: [delayed_on: 50ms, delayed_off: 50ms]
    on_state:
      then:
        - logger.log:
            level: INFO
            format: "DOOR G1 %s"
            args: ['id(door_g1).state ? "OPEN" : "SHUT"']
  - platform: gpio
    name: "Studio door - G2 side"
    id: door_g2
    pin: { number: GPIO26, mode: { input: true, pullup: true } }
    device_class: door
    filters: [delayed_on: 50ms, delayed_off: 50ms]
    on_state:
      then:
        - logger.log:
            level: INFO
            format: "DOOR G2 %s"
            args: ['id(door_g2).state ? "OPEN" : "SHUT"']
  - platform: gpio
    name: "Studio sink leak"
    id: studio_sink_leak
    pin: { number: GPIO27, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
    on_state:
      then:
        - logger.log:
            level: INFO
            format: "LEAK %s"
            args: ['id(studio_sink_leak).state ? "WET" : "DRY"']
  - platform: ld2410
    has_target:
      name: "Studio presence"
      device_class: occupancy

  # Instrument climate guard. Instruments want roughly 35-65% relative
  # humidity. A plain reading — the app decides what to do about it.
  - platform: template
    name: "Studio humidity out of safe band"
    device_class: problem
    lambda: |-
      if (isnan(id(studio_rh).state)) return {};
      return id(studio_rh).state < 35.0 || id(studio_rh).state > 65.0;

# Compact JSON for the door board / phones: GET /text_sensor/studio_live
# Throttled to 200 ms so the 20 ms ADC does not flood Wi-Fi.
text_sensor:
  - platform: template
    name: "Studio live"
    id: studio_live
    update_interval: 200ms
    lambda: |-
      if (isnan(id(studio_dba).state)) return {};
      char buf[128];
      snprintf(buf, sizeof(buf),
               "{\"dba\":%.1f,\"g1\":%s,\"g2\":%s,\"leak\":%s}",
               id(studio_dba).state,
               id(door_g1).state ? "true" : "false",
               id(door_g2).state ? "true" : "false",
               id(studio_sink_leak).state ? "true" : "false");
      return {std::string(buf)};
  - platform: wifi_info
    ip_address:
      name: "IP address"
      on_value:
        then:
          - logger.log:
              level: INFO
              format: "AANGAN READY - open http://%s/ on any phone"
              args: ["x.c_str()"]

# Wi-Fi to the G2 door. 100 ms is fast enough for a clap; 20 ms would flood the radio.
packet_transport:
  - platform: espnow
    peer_address: "68:09:47:9D:B7:C4"
    encryption: "AanganDoor1"
    update_interval: 100ms
    sensors:
      - studio_dba
    binary_sensors:
      - door_g1
      - door_g2
      - studio_sink_leak
