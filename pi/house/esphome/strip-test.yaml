# AANGAN · STRIP TEST — temporary, for the bench only.
# Proves the WS2812 strip, the colours and the switch behaviour before any of
# it goes near a wall. Everything here transfers unchanged to the Waveshare
# display board once we have its pinout.
#
# WIRING (three wires):
#   strip RED   -> ESP32 5V     (see the brightness cap note below)
#   strip WHITE -> ESP32 GND
#   strip GREEN -> ESP32 GPIO4  (ideally through a 470 ohm resistor)
#
# POWER SAFETY: only 12 LEDs are driven and brightness is capped at 30%.
# That is about 220 mA, safe from the USB port. Do NOT raise num_leds or
# max_brightness while the strip is powered from the board.
esphome:
  name: strip-test
  friendly_name: Strip Test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key_air_nodes
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 5min
  manual_ip:
    static_ip: 192.168.0.247
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  ap:
    ssid: "strip-test setup"
    password: !secret ap_password
captive_portal:

web_server:
  port: 80

light:
  - platform: esp32_rmt_led_strip
    id: tally
    name: "Tally strip"
    chipset: ws2812
    rgb_order: GRB
    pin: GPIO4
    num_leds: 12
    default_transition_length: 300ms
    max_refresh_rate: 33ms

# The recording switch. Wire between GPIO23 and GND, or just bridge them with
# a jumper to simulate it. No switch attached = reads "not recording".
binary_sensor:
  - platform: gpio
    id: rec_switch
    name: "Recording switch"
    pin: { number: GPIO23, mode: { input: true, pullup: true }, inverted: true }
    filters: [delayed_on: 40ms, delayed_off: 40ms]
    on_state:
      - script.execute: show_state

# Cycles forever so there is no timing to get wrong. If the strip is wired
# correctly this CANNOT be missed.
interval:
  - interval: 1200ms
    then:
      - lambda: |-
          static int step = 0;
          auto call = id(tally).turn_on();
          call.set_brightness(0.5f);
          switch (step % 4) {
            case 0: call.set_rgb(1.0f, 0.0f, 0.0f); ESP_LOGI("main", "STRIP: RED"); break;
            case 1: call.set_rgb(0.0f, 1.0f, 0.0f); ESP_LOGI("main", "STRIP: GREEN"); break;
            case 2: call.set_rgb(0.0f, 0.0f, 1.0f); ESP_LOGI("main", "STRIP: BLUE"); break;
            default: call.set_rgb(1.0f, 1.0f, 1.0f); ESP_LOGI("main", "STRIP: WHITE"); break;
          }
          call.set_transition_length(0);
          call.perform();
          step++;

script:
  - id: show_state
    then:
      - if:
          condition:
            binary_sensor.is_on: rec_switch
          then:
            - light.turn_on: {id: tally, red: 100%, green: 0%, blue: 0%, brightness: 30%}
            - logger.log: "RECORDING - strip is RED"
          else:
            - light.turn_on: {id: tally, red: 0%, green: 100%, blue: 20%, brightness: 18%}
            - logger.log: "AVAILABLE - strip is GREEN"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      on_value:
        then:
          - logger.log:
              level: INFO
              format: "STRIP TEST READY - open http://%s/ on the iPad"
              args: ["x.c_str()"]
