# ESP32 node 2 — STUDIO SENSE
# In the recording room: dBA meter (SEN0232) at ear height near the recording
# position, LD2410 presence, and the WS2812B recording tally strip.
# SEN0232 outputs 0.6–2.6 V for 30–130 dBA (dBA = V × 50) — safe for the ESP32
# ADC at 12db attenuation, no divider needed. Studio signal goes to GPIO34;
# teaching-room signal goes to GPIO35.
# LD2410 on hardware UART2 (GPIO16 RX ← LD2410 TX, GPIO17 TX → LD2410 RX), 256000 baud.
# WS2812B data on GPIO18 THROUGH the 74AHCT level shifter, strip powered by the 5V SMPS
# with grounds common.
esphome:
  name: studio-sense
  friendly_name: Studio Sense

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  # USB logging stays ON. The LD2410 uses UART2 on GPIO16/17; UART0 (USB) is
  # free, and we need it to read the node's address during commissioning.

api:
  encryption:
    key: !secret api_key_studio_sense
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 4-AP mesh: default Wi-Fi power saving drops the association and loops forever.
  power_save_mode: none
  reboot_timeout: 5min
  ap:
    ssid: "studio-sense setup"
    password: !secret ap_password
captive_portal:

# Live page at http://<its-ip>/ so the meter can be read and calibrated from a
# phone with no Home Assistant and no Raspberry Pi.
web_server:
  port: 80

uart:
  id: ld2410_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: ld2410_uart

sensor:
  # DFRobot's specified conversion is dBA = output voltage × 50.
  - platform: adc
    pin: GPIO34
    name: "Studio sound level"
    id: studio_dba
    unit_of_measurement: "dBA"
    device_class: sound_pressure
    attenuation: 12db
    update_interval: 200ms
    filters:
      - multiply: 50.0
      - sliding_window_moving_average:
          window_size: 10
          send_every: 5
    accuracy_decimals: 1
  # TEACHING ROOM METER — NOT BUILT. Only one SEN0232 was bought; the second
  # (about ₹4,799) has not been ordered. Left commented rather than active,
  # because an ADC pin with nothing wired to it reports convincing nonsense and
  # someone will believe it. Uncomment the day the second meter arrives.
  # - platform: adc
  #   pin: GPIO35
  #   name: "Teaching sound level"
  #   id: teaching_dba
  #   unit_of_measurement: "dBA"
  #   device_class: sound_pressure
  #   attenuation: 12db
  #   update_interval: 200ms
  #   filters:
  #     - multiply: 50.0
  #     - sliding_window_moving_average:
  #         window_size: 10
  #         send_every: 5
  #   accuracy_decimals: 1

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Studio presence"
      device_class: occupancy
  - platform: status
    name: "Studio sense node online"

# Shows the address on the node's own page and announces it over USB on boot.
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      on_value:
        then:
          - logger.log:
              level: INFO
              format: "AANGAN READY - open http://%s/ on any phone"
              args: ["x.c_str()"]

# TALLY LIGHT — NOT BUILT. The WS2812B strip and its 74AHCT level shifter were
# both on the "already owned" list that turned out to be wrong, so neither is in
# the building. Uncomment when they are.
# light:
