# ESP32 node 1 — STUDIO DOORS
# Two double-doors (recording studio + teaching room), TWO reeds per door,
# one reed on each leaf, mounted BETWEEN the leaves at the top rail.
# Reed = MC-38 (Jason owns 9). Wire: one lead to GPIO, one to GND.
esphome:
  name: studio-doors
  friendly_name: Studio Doors

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
api:
  encryption:
    key: !secret api_key_studio_doors
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The house runs a 4-AP mesh, all advertising the same SSID. Two settings
  # matter here and both were learned the hard way on 13 Aug:
  #   power_save_mode: none  — the ESP32's default Wi-Fi power saving drops the
  #     association on a mesh and then loops on "attempt 2/3" forever.
  #   reboot_timeout          — if it ever does get properly stuck, reboot rather
  #     than sit there unreachable.
  power_save_mode: none
  reboot_timeout: 5min
  ap:
    ssid: "studio-doors setup"
    password: !secret ap_password
captive_portal:

# Commissioning aid: this node serves its own live page at http://<its-ip>/ so
# the doors can be tested and mounted from a phone BEFORE the House Pi exists.
# Harmless once Home Assistant adopts the node — leave it on.
web_server:
  port: 80

binary_sensor:
  - platform: gpio
    name: "Studio door leaf A"
    pin: { number: GPIO25, mode: { input: true, pullup: true }, inverted: true }
    device_class: door
    filters: [delayed_on: 50ms, delayed_off: 50ms]
  - platform: gpio
    name: "Studio door leaf B"
    pin: { number: GPIO26, mode: { input: true, pullup: true }, inverted: true }
    device_class: door
    filters: [delayed_on: 50ms, delayed_off: 50ms]
  - platform: gpio
    name: "Teaching door leaf A"
    pin: { number: GPIO32, mode: { input: true, pullup: true }, inverted: true }
    device_class: door
    filters: [delayed_on: 50ms, delayed_off: 50ms]
  - platform: gpio
    name: "Teaching door leaf B"
    pin: { number: GPIO33, mode: { input: true, pullup: true }, inverted: true }
    device_class: door
    filters: [delayed_on: 50ms, delayed_off: 50ms]
  - platform: status
    name: "Studio doors node online"

# Shows the node's own address on its web page, and announces it over USB on
# boot so the address can be found without guessing.
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      on_value:
        then:
          - logger.log:
              level: INFO
              format: "AANGAN READY - open http://%s/ on any phone"
              args: ["x.c_str()"]
