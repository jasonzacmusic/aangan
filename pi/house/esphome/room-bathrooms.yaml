# AANGAN · ROOM NODE — BATHROOMS + GEYSER
#
# Label this board BATHROOMS.
# Bathrooms are normally adjacent, so one board reaches all of them with short
# probe leads. If your two bathrooms are far apart, tell me and this splits into
# two boards — that is exactly the trade this room-based layout is built for.
#
# WIRING — every probe goes between its pin and GND:
#   GPIO25  bathroom 1 floor
#   GPIO26  bathroom 2 floor
#   GPIO27  geyser overflow / drip tray
#   GPIO32  washbasin under-trap
#   GPIO33  water heater area / spare
#
# The raindrop-style probes are TWO boards joined by a cable: the flat comb goes
# on the floor, the little board with the blue knob stays dry near the ESP32.
# Only the comb should ever get wet.
#
# Power: one 5V USB charger. Keep the board itself OUT of the wet zone —
# mount it high, outside the splash area, ideally just outside the door.
esphome:
  name: room-bathrooms
  friendly_name: Bathrooms

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key_wet_zones
  reboot_timeout: 0s   # no Home Assistant in this setup

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 5min
  ap:
    ssid: "room-bathrooms setup"
    password: !secret ap_password
captive_portal:

web_server:
  port: 80

binary_sensor:
  # Probes close to GND when wet. All five pins here have usable internal
  # pull-ups, so no extra resistors are needed — that was only a problem on
  # GPIO34/35/39, which this layout deliberately avoids.
  - platform: gpio
    name: "Bathroom 1 leak"
    pin: { number: GPIO25, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Bathroom 2 leak"
    pin: { number: GPIO26, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Geyser overflow"
    pin: { number: GPIO27, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Washbasin leak"
    pin: { number: GPIO32, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Water heater area leak"
    pin: { number: GPIO33, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      on_value:
        then:
          - logger.log:
              level: INFO
              format: "AANGAN READY - open http://%s/ on any phone"
              args: ["x.c_str()"]
