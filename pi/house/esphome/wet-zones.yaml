# ESP32 node 4 — WET ZONES
# Water-leak probes at every low point. GPIO34/35/39 have no internal pull-up:
# add a 10k resistor from each of those GPIOs to 3.3 V. All probes close to GND
# when wet. Keep runs short and use twisted pair.
esphome:
  name: wet-zones
  friendly_name: Wet Zones

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
api:
  encryption:
    key: !secret api_key_wet_zones
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 4-AP mesh: default Wi-Fi power saving drops the association and loops forever.
  power_save_mode: none
  reboot_timeout: 5min
  ap:
    ssid: "wet-zones setup"
    password: !secret ap_password
captive_portal:

# Commissioning aid: live page at http://<its-ip>/ so probes can be tested from
# a phone before the House Pi exists. Harmless once Home Assistant adopts it.
web_server:
  port: 80

binary_sensor:
  - platform: gpio
    name: "Bathroom 1 leak"
    pin: { number: GPIO25, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Bathroom 2 leak"
    pin: { number: GPIO26, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Geyser overflow leak"
    pin: { number: GPIO32, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Washing machine leak"
    pin: { number: GPIO27, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Studio sink leak"
    pin: { number: GPIO33, mode: { input: true, pullup: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Teaching sink leak"
    pin: { number: GPIO34, mode: { input: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "House sink leak"
    pin: { number: GPIO35, mode: { input: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: gpio
    name: "Floor drain leak"
    pin: { number: GPIO39, mode: { input: true }, inverted: true }
    device_class: moisture
    filters: [delayed_on: 500ms]
  - platform: status
    name: "Wet zones node online"

# Shows the address on the node's own page and announces it over USB on boot.
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
      on_value:
        then:
          - logger.log:
              level: INFO
              format: "AANGAN READY - open http://%s/ on any phone"
              args: ["x.c_str()"]
