# ─────────────────────────────────────────────────────────────────────────────
# STUDIO COMMAND — Home Assistant package (HOUSE Pi, Home Assistant OS ≥2026.7)
# Drop into /config/packages/ and add to configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# Entity ids below match the ESPHome nodes in pi/house/esphome/. Rename in ONE
# place (here) if your ids differ after adoption.
# Replace notify.all_family with a notify group of every Companion-app phone.
# ─────────────────────────────────────────────────────────────────────────────

input_select:
  studio_state:
    name: Studio state
    options: [available, class, meeting, audio_rec, video_rec, emergency]
    icon: mdi:tune-variant

input_number:
  studio_db_threshold:
    name: Studio dB threshold (trained)
    min: 30
    max: 90
    step: 0.5
    unit_of_measurement: dBA
    icon: mdi:waveform
    # Never hand-set: the Mac agent's `train` mode writes this from labelled takes.

input_text:
  studio_state_set_by:
    name: Who set the studio state
    initial: "Studio Command"

template:
  - binary_sensor:
      # ── the one authoritative verdict ──────────────────────────────────────
      - name: studio_ready
        unique_id: studio_ready_verdict
        device_class: running
        state: >
          {{ is_state('binary_sensor.studio_doors_ok', 'on')
             and is_state('binary_sensor.studio_quiet', 'on')
             and is_state('binary_sensor.studio_sensors_healthy', 'on')
             and is_state('binary_sensor.house_safety_clear', 'on') }}

      - name: studio_doors_ok
        state: >
          {{ is_state('binary_sensor.studio_door_leaf_a', 'off')
             and is_state('binary_sensor.studio_door_leaf_b', 'off')
             and is_state('binary_sensor.teaching_door_leaf_a', 'off')
             and is_state('binary_sensor.teaching_door_leaf_b', 'off') }}

      # Hysteresis: goes quiet only after holding under (threshold − 2 dB) for
      # 20 s (the delay_on below), goes loud immediately past (threshold + 1 dB).
      - name: studio_quiet
        delay_on: "00:00:20"
        state: >
          {% set db = states('sensor.studio_sound_level') | float(999) %}
          {% set thr = states('input_number.studio_db_threshold') | float(40) %}
          {% if this.state == 'on' %}
            {{ db < thr + 1 }}
          {% else %}
            {{ db < thr - 2 }}
          {% endif %}

      - name: studio_sensors_healthy
        state: >
          {{ is_state('binary_sensor.studio_doors_node_online', 'on')
             and is_state('binary_sensor.studio_sense_node_online', 'on')
             and is_state('binary_sensor.kitchen_safety_node_online', 'on')
             and is_state('binary_sensor.wet_zones_node_online', 'on')
             and is_state('binary_sensor.perimeter_node_online', 'on')
             and is_state('binary_sensor.panic_loop_node_online', 'on') }}

      - name: house_safety_clear
        state: >
          {{ is_state('binary_sensor.lpg_detector_alarm_contact', 'off')
             and is_state('binary_sensor.smoke_alarm_studio_flat', 'off')
             and is_state('binary_sensor.smoke_alarm_house_flat', 'off')
             and is_state('binary_sensor.kitchen_flame_sensor', 'off')
             and is_state('binary_sensor.studio_flame_sensor', 'off')
             and is_state('binary_sensor.teaching_room_flame_sensor', 'off')
             and is_state('binary_sensor.hall_flame_sensor', 'off')
             and is_state('binary_sensor.panic_loop_broken', 'off')
             and is_state('binary_sensor.bathroom_1_leak', 'off')
             and is_state('binary_sensor.bathroom_2_leak', 'off')
             and is_state('binary_sensor.geyser_overflow_leak', 'off')
             and is_state('binary_sensor.washing_machine_leak', 'off')
             and is_state('binary_sensor.studio_sink_leak', 'off')
             and is_state('binary_sensor.teaching_sink_leak', 'off')
             and is_state('binary_sensor.house_sink_leak', 'off')
             and is_state('binary_sensor.floor_drain_leak', 'off')
             and is_state('binary_sensor.kitchen_sink_leak', 'off')
             and states('binary_sensor.main_door_vibration') in ['unknown', 'unavailable', '', 'off']
             and states('binary_sensor.balcony_vibration') in ['unknown', 'unavailable', '', 'off'] }}

      - name: house_fire_any
        unique_id: house_fire_any
        device_class: smoke
        state: >
          {{ is_state('binary_sensor.smoke_alarm_studio_flat', 'on')
             or is_state('binary_sensor.smoke_alarm_house_flat', 'on')
             or is_state('binary_sensor.kitchen_flame_sensor', 'on')
             or is_state('binary_sensor.studio_flame_sensor', 'on')
             or is_state('binary_sensor.teaching_room_flame_sensor', 'on')
             or is_state('binary_sensor.hall_flame_sensor', 'on') }}

      - name: house_water_leak_any
        unique_id: house_water_leak_any
        device_class: moisture
        state: >
          {{ is_state('binary_sensor.kitchen_sink_leak', 'on')
             or is_state('binary_sensor.bathroom_1_leak', 'on')
             or is_state('binary_sensor.bathroom_2_leak', 'on')
             or is_state('binary_sensor.geyser_overflow_leak', 'on')
             or is_state('binary_sensor.washing_machine_leak', 'on')
             or is_state('binary_sensor.studio_sink_leak', 'on')
             or is_state('binary_sensor.teaching_sink_leak', 'on')
             or is_state('binary_sensor.house_sink_leak', 'on')
             or is_state('binary_sensor.floor_drain_leak', 'on') }}

# ── critical alerts: repeat until acknowledged, bypass silent mode ───────────
alert:
  fire_alarm:
    name: "🔥 FIRE — smoke or flame detected"
    entity_id: binary_sensor.house_fire_any
    state: "on"
    repeat: [1, 2, 5]
    can_acknowledge: true
    notifiers: [all_family_critical]
  gas_alarm:
    name: "⚠️ LPG GAS detected in the kitchen"
    entity_id: binary_sensor.lpg_detector_alarm_contact
    state: "on"
    repeat: [1, 2, 5]
    can_acknowledge: true
    notifiers: [all_family_critical]
  panic_alarm:
    name: "🆘 PANIC button pressed"
    entity_id: binary_sensor.panic_loop_broken
    state: "on"
    repeat: [1, 2]
    can_acknowledge: true
    notifiers: [all_family_critical]
  water_leak_alarm:
    name: "WATER LEAK detected"
    entity_id: binary_sensor.house_water_leak_any
    state: "on"
    repeat: [2, 5, 15]
    can_acknowledge: true
    notifiers: [all_family_critical]

notify:
  - name: all_family
    platform: group
    services:
      # The same real phone services as the critical group, without bypassing
      # silent mode. Air/class/perimeter nudges use this route.
      - action: mobile_app_jasons_iphone
      - action: mobile_app_family_android
  - name: all_family_critical
    platform: group
    services:
      # one entry per phone; the data block makes iOS ring THROUGH silent mode
      # and Android use the alarm channel (verified Companion-app syntax):
      - action: mobile_app_jasons_iphone
        data:
          data:
            push:
              sound: { name: default, critical: 1, volume: 1.0 }
      - action: mobile_app_family_android
        data:
          data:
            ttl: 0
            priority: high
            channel: alarm_stream

script:
  studio_silence_room:
    alias: "Studio · silence room and remember devices"
    mode: single
    sequence:
      - action: scene.create
        data:
          scene_id: aangan_before_silence
          snapshot_entities:
            - switch.doorbell_chime
            - climate.studio_ac
            - fan.studio_fan
      - action: switch.turn_off
        target: { entity_id: switch.doorbell_chime }
      - action: climate.turn_off
        target: { entity_id: climate.studio_ac }
      - action: fan.turn_off
        target: { entity_id: fan.studio_fan }

  studio_restore_room:
    alias: "Studio · restore devices after recording"
    mode: restart
    sequence:
      - action: scene.turn_on
        target: { entity_id: scene.aangan_before_silence }

automation:
  - id: critical_sensor_sets_emergency
    alias: "Critical sensor → emergency state"
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.house_fire_any
          - binary_sensor.lpg_detector_alarm_contact
          - binary_sensor.panic_loop_broken
          - binary_sensor.house_water_leak_any
        to: "on"
    action:
      - action: input_select.select_option
        target: { entity_id: input_select.studio_state }
        data: { option: emergency }
      - action: input_text.set_value
        target: { entity_id: input_text.studio_state_set_by }
        data: { value: "Safety · {{ trigger.to_state.name }}" }

  - id: studio_state_lights
    alias: "Studio state → room signs + tally"
    trigger:
      - platform: state
        entity_id: input_select.studio_state
    action:
      - variables:
          colors:
            available: [47, 191, 113]
            class: [245, 166, 35]
            meeting: [245, 166, 35]
            audio_rec: [229, 72, 77]
            video_rec: [217, 48, 54]
            emergency: [124, 58, 237]
          c: "{{ colors[trigger.to_state.state] }}"
      - action: light.turn_on
        target: { entity_id: light.studio_tally_strip }
        data: { rgb_color: "{{ c }}", brightness: 200 }

  - id: rec_cues_piano
    alias: "Recording state → cue the piano rig"
    trigger:
      - platform: state
        entity_id: input_select.studio_state
        to: [audio_rec, video_rec]
    action:
      - action: rest_command.piano_cue_recording

  - id: rec_done_piano
    alias: "Leaving Rec → piano at ease"
    trigger:
      - platform: state
        entity_id: input_select.studio_state
        from:
          - audio_rec
          - video_rec
    action:
      - action: rest_command.piano_cue_stopped

  - id: imposter_watch
    alias: "Perimeter trip while nobody expects it"
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.main_door_vibration
          - binary_sensor.balcony_vibration
        to: "on"
    condition:
      - condition: state
        entity_id: input_select.studio_state
        state: [audio_rec, video_rec, class, meeting]
    action:
      - action: notify.all_family_critical
        data:
          title: "Perimeter"
          message: "Movement at {{ trigger.to_state.name }} while the studio is busy."

rest_command:
  piano_cue_recording:
    url: "http://piano.local:8951/cue"
    method: post
    content_type: application/json
    payload: '{"cue": "recording_started"}'
    timeout: 3
  piano_cue_stopped:
    url: "http://piano.local:8951/cue"
    method: post
    content_type: application/json
    payload: '{"cue": "recording_stopped"}'
    timeout: 3
